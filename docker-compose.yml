# Orden de arranque con `docker compose up -d`:
#   1. postgres  -> espera a que acepte conexiones (healthcheck pg_isready)
#   2. backend   -> arranca solo con postgres "healthy"; queda "healthy" cuando responde HTTP
#   3. frontend  -> arranca solo con backend "healthy"
services:
  postgres:
    image: postgres:16-alpine
    container_name: jugadores-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jugadores
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jugadores"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: jugadores-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      # Dentro de la red de compose el host de la BD es el nombre del servicio
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jugadores
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:4200
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No hay endpoint público de salud: cualquier respuesta HTTP (incluido 401/404) significa que la API está arriba
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: jugadores-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
