services:
  postgres:
    image: postgres:16-alpine
    container_name: jugadores-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jugadores
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: jugadores-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jugadores
      JWT_SECRET: change-this-secret-in-production
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:4200
      AUTO_SEED: "true"
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: jugadores-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: jugadores-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: jugadores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SCHEDULE: "@daily"
      BACKUP_ON_START: "TRUE"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - ./backups:/backups

volumes:
  postgres-data:
