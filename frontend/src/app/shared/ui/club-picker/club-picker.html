<div class="backdrop" (click)="close()">
  <div class="dialog" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-label="Selecciona el club">
    <div class="dhead">
      <h3>Selecciona el club</h3>
      <button type="button" class="iconbtn" (click)="close()" aria-label="Cerrar">✕</button>
    </div>
    <span class="league-context mono">{{ liga().nombre }} · {{ liga().pais }}</span>

    <input
      type="text"
      class="search mono"
      placeholder="Buscar club…"
      [value]="search()"
      (input)="onSearchInput($event)"
      autofocus
    />

    <div class="list">
      @for (team of results(); track team.id) {
        <button type="button" class="option" (click)="choose(team)">
          @if (logoFor(team); as logo) {
            <img class="logo" [src]="logo" alt="" />
          } @else {
            <span class="logo-fallback">{{ initialsFor(team) }}</span>
          }
          <span class="name">{{ team.nombre }}</span>
        </button>
      } @empty {
        <div class="empty">Sin resultados para "{{ search() }}".</div>
      }
    </div>
  </div>
</div>
