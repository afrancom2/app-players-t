server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Fallback SPA: las rutas de Angular (/jugadores, /login...) sirven index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los assets con hash se pueden cachear agresivamente
  location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
